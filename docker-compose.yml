# Hosted 100 Deep behind your own TLS-terminating proxy.
#   docker compose up -d --build
services:
  100-deep:
    build: .
    image: 100-deep
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      THANG_MAX_SESSIONS: "32"        # concurrent games (one engine process each)
      THANG_IDLE_SECONDS: "300"       # save and stop a game this long after its player leaves
      # THANG_ALLOWED_ORIGINS: "https://play.example.com"
    volumes:
      - 100-deep-data:/data       # per-session saves, scores and lore
    # Each engine uses ~10-20 MB; cap the container to protect the host
    mem_limit: 1g
    pids_limit: 256
    read_only: true
    tmpfs:
      - /tmp
volumes:
  100-deep-data:
